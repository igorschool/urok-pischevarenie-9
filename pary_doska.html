<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Групповой лист на доске</title>
  <style>
    :root { --teal:#0E3B43; --ink:#1C2B2E; --sand:#F6F1EA; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Calibri, "Segoe UI", sans-serif; background: var(--sand); color: var(--ink); }
    .top { background: var(--teal); color:#fff; padding: 14px 24px; display:flex; justify-content:space-between; align-items:center; gap: 16px; }
    .top b { font-size: 22px; }
    .top a { color:#E7C56A; font-size: 18px; }
    main { padding: 18px 24px 40px; max-width: 1100px; margin: 0 auto; }
    .lead { font-size: 20px; margin: 0 0 16px; line-height: 1.4; }
    .roles { display:grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .role { background:#fff; border: 2px solid #111; border-radius: 14px; padding: 14px 16px 16px; color:#111; }
    .role h2 { margin: 0 0 10px; font-size: 22px; color: var(--teal); }
    button.show {
      font-family: inherit; font-size: 20px; font-weight: 700;
      background: #FFE38A; color: #111; border: 2px solid #111;
      border-radius: 12px; padding: 10px 14px; cursor: pointer;
    }
    .answer { margin: 0; font-size: 22px; line-height: 1.4; color: #111; }
    .common { margin-top: 16px; background: var(--teal); color: #fff; border-radius: 14px; padding: 16px 18px; }
    .common h2 { margin: 0 0 10px; font-size: 24px; }
    .common .answer { color: #111; background: #fff; border-radius: 10px; padding: 12px 14px; }
    .actions { margin-top: 16px; }
    button.hide {
      font-family: inherit; font-size: 18px; background: #fff; color: #111;
      border: 2px solid #111; border-radius: 12px; padding: 10px 14px; cursor: pointer;
    }
    @media (max-width: 800px) { .roles { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="top">
    <b>Групповой лист на доске</b>
    <a href="index.html">Меню</a>
  </div>
  <main>
    <p class="lead">Четыре роли, потом один общий ответ. Здесь только правильные ответы. Открывайте роль, когда группа уже сказала свою.</p>
    <div class="roles" id="roles"></div>
    <section class="common">
      <h2>Общий ответ</h2>
      <div id="common"></div>
    </section>
    <div class="actions">
      <button type="button" class="hide" id="hide">Скрыть ответы</button>
    </div>
  </main>
  <script>
    const ROLES = [
      {
        title: "Роль 1. Порядок",
        answer: "1 рот, 2 пищевод, 3 желудок, 4 тонкая кишка, 5 толстая кишка."
      },
      {
        title: "Роль 2. Пищевод",
        answer: "Только проводит пищу в желудок. Сам её не переваривает."
      },
      {
        title: "Роль 3. Желудок",
        answer: "Удерживает и перемешивает пищу. Мясо стоит вверху, под рёбрами: это желудок."
      },
      {
        title: "Роль 4. Тонкая кишка",
        answer: "Здесь пища всасывается. После молока вздутие по всему животу: это тонкая кишка."
      }
    ];
    const COMMON = "Пища идёт: рот → пищевод → желудок → тонкая кишка → толстая кишка. Пищевод только проводит пищу. Желудок удерживает и перемешивает, там стоит мясо. В тонкой кишке пища всасывается, там бывает вздутие от молока.";

    const open = { roles: {}, common: false };

    function render() {
      const box = document.getElementById("roles");
      box.innerHTML = "";
      ROLES.forEach((role, i) => {
        const card = document.createElement("article");
        card.className = "role";
        const h = document.createElement("h2");
        h.textContent = role.title;
        card.appendChild(h);
        if (open.roles[i]) {
          const p = document.createElement("p");
          p.className = "answer";
          p.textContent = role.answer;
          card.appendChild(p);
        } else {
          const b = document.createElement("button");
          b.type = "button";
          b.className = "show";
          b.textContent = "Показать ответ";
          b.addEventListener("click", () => {
            open.roles[i] = true;
            render();
          });
          card.appendChild(b);
        }
        box.appendChild(card);
      });
      const common = document.getElementById("common");
      common.innerHTML = "";
      if (open.common) {
        const p = document.createElement("p");
        p.className = "answer";
        p.textContent = COMMON;
        common.appendChild(p);
      } else {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "show";
        b.textContent = "Показать общий ответ";
        b.addEventListener("click", () => {
          open.common = true;
          render();
        });
        common.appendChild(b);
      }
    }

    document.getElementById("hide").addEventListener("click", () => {
      open.roles = {};
      open.common = false;
      render();
    });

    render();
  </script>
</body>
</html>
